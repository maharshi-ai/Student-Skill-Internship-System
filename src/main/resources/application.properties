# Server Configuration
server.port=${PORT:8080}

# Static resource handling — serve everything under /static/ at root path
# Default /** pattern is intentionally kept to serve login.html, etc. from /static/
spring.web.resources.static-locations=classpath:/static/

# Disable Thymeleaf (pages are plain HTML served as static resources via forward)
spring.thymeleaf.enabled=false

# Jackson: serialize LocalDate/LocalDateTime as strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Harden the session cookie. SameSite=Lax reduces cross-site cookie sending.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
