# Server Configuration
server.port=${PORT:8080}

# Serve files in classpath:/static at the root URL path.
# Keep the default Spring static-resource mapping so /login.html and
# the page-controller forwards to /login.html resolve correctly.
spring.web.resources.static-locations=classpath:/static/

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/static/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# Jackson: serialize LocalDate/LocalDateTime as strings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
